name: Android Play Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "tests/emulator-services.test.cjs"
      - "apps/web/**"
      - "package-lock.json"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "tests/emulator-services.test.cjs"
      - "apps/web/**"
      - "package-lock.json"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-play-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify emulator boot readiness gate
        run: node --test tests/emulator-services.test.cjs

      - name: Verify Android version source
        run: node apps/android/verify-version.mjs

      - name: Google Play compliance gate
        run: npm run check:play-compliance

      - name: Validate Windows signing helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "apps/android/build-signed-release.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            exit 1
          }

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Load Firebase client configuration when configured
        shell: bash
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > apps/android/app/google-services.json
          fi

      - name: Android lint, debug APK, R8 release APK and release bundle
        working-directory: apps/android
        run: gradle :app:lintRelease :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Record release shrinker evidence
        shell: bash
        run: |
          sha256sum apps/android/app/build/outputs/bundle/release/app-release.aab > apps/android/app/build/outputs/bundle/release/app-release.aab.sha256
          test -s apps/android/app/build/outputs/mapping/release/mapping.txt

      - name: Preserve R8 release evidence
        uses: actions/upload-artifact@v7
        with:
          name: android-r8-release-evidence
          path: |
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/bundle/release/app-release.aab.sha256
            apps/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 7


  launch-smoke:
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34, 35, 36]
    name: Android ${{ matrix.api }} launch and scroll smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Build current web checkout and install smoke harness
        run: |
          npm ci
          npm run build:web
          npm ci --prefix apps/android/tests
          npm run start --workspace=apps/web > /tmp/fcarena-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/fcarena-next.log
          exit 1

      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Build debug APK
        working-directory: apps/android
        run: gradle :app:assembleDebug --stacktrace

      - name: Real WebView swipe and navigation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            bash apps/android/tests/wait-for-emulator-services.sh
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n in.fcarena.app.debug/in.fcarena.app.MainActivity
            bash apps/android/tests/run-emulator-smoke.sh
            # The smoke harness itself performs five real HOME -> resume cycles.
            # Keep the cold-launch loop on one shell line because
            # android-emulator-runner executes script lines independently.
            for cycle in 1 2 3 4 5; do adb shell am force-stop in.fcarena.app.debug; adb shell am start -W -n in.fcarena.app.debug/in.fcarena.app.MainActivity; sleep 3; adb shell pidof in.fcarena.app.debug > /dev/null; done
            adb logcat -d > /tmp/fcarena-smoke/logcat.txt
            if grep -E 'FATAL EXCEPTION|ANR in in.fcarena|Render process.*crash' /tmp/fcarena-smoke/logcat.txt; then exit 1; fi

      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.api }}-scroll-evidence
          path: |
            /tmp/fcarena-smoke
            /tmp/fcarena-next.log
          retention-days: 7
