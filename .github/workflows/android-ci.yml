name: Android Play Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "apps/web/public/.well-known/assetlinks.json"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "apps/web/public/.well-known/assetlinks.json"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-play-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Android lint and release bundle
        working-directory: apps/android
        run: gradle :app:lintRelease :app:bundleRelease --stacktrace

      - name: Upload unsigned validation AAB
        uses: actions/upload-artifact@v4
        with:
          name: fc-arena-android-validation-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
