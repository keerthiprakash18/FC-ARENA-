name: Android Play Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "apps/web/public/.well-known/assetlinks.json"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "apps/web/public/.well-known/assetlinks.json"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-play-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Android lint and release bundle
        working-directory: apps/android
        run: gradle :app:lintRelease :app:bundleRelease --stacktrace

      - name: Upload unsigned validation AAB
        uses: actions/upload-artifact@v4
        with:
          name: fc-arena-android-validation-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7


  launch-smoke:
    name: Android emulator launch smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Build debug APK
        working-directory: apps/android
        run: gradle :app:assembleDebug --stacktrace

      - name: Launch app on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop in.fcarena.app.debug
            adb shell am start -W -n in.fcarena.app.debug/in.fcarena.app.MainActivity
            sleep 10
            test -n "$(adb shell pidof in.fcarena.app.debug | tr -d '\r')" || { echo "FC Arena process exited after launch."; adb logcat -d -t 500; exit 1; }
            echo "FC Arena is alive after launch with PID $(adb shell pidof in.fcarena.app.debug | tr -d '\r')"
            adb logcat --pid="$(adb shell pidof in.fcarena.app.debug | tr -d '\r')" -d -t 300 | tee /tmp/fcarena-logcat.txt
            if grep -q "FATAL EXCEPTION" /tmp/fcarena-logcat.txt; then echo "Fatal Android exception detected."; exit 1; fi
