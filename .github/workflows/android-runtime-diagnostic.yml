name: Android Runtime Launch Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - diag/android-launch-emulator

permissions:
  contents: read

jobs:
  runtime-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: apps/android
        run: gradle :app:clean :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and launch FC Arena
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n in.fcarena.app.debug/com.google.androidbrowserhelper.trusted.LauncherActivity || true
            sleep 12
            adb shell dumpsys activity activities | grep -A 8 -B 2 "in.fcarena.app.debug" || true
            adb logcat -d -v threadtime > /tmp/fcarena-logcat.txt
            echo "=== FC ARENA / FATAL EXCEPTION EXCERPTS ==="
            grep -n -E "FATAL EXCEPTION|AndroidRuntime|in\.fcarena\.app|TWALauncher|TrustedWeb|LauncherActivity" /tmp/fcarena-logcat.txt | tail -n 240 || true
            if grep -A 30 "FATAL EXCEPTION" /tmp/fcarena-logcat.txt | grep -q "in.fcarena.app.debug"; then
              echo "FC Arena crashed during launch"
              exit 1
            fi

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcarena-runtime-logcat
          path: /tmp/fcarena-logcat.txt
          if-no-files-found: warn
          retention-days: 3
