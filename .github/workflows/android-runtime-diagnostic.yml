name: Android Runtime Launch Diagnostic

on:
  push:
    branches:
      - fix/android-safe-launcher-v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: apps/android
        run: gradle :app:clean :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and launch FC Arena
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n in.fcarena.app.debug/in.fcarena.app.SafeLauncherActivity || true
            sleep 12
            adb logcat -d -v threadtime > /tmp/fcarena-logcat.txt
            echo "=== FC ARENA launch excerpts ==="
            grep -n -E "FATAL EXCEPTION|AndroidRuntime|FCArenaLauncher|TWALauncher|TrustedWeb|SafeLauncherActivity|in\.fcarena\.app" /tmp/fcarena-logcat.txt | tail -n 260 || true
            test "$(grep -B 2 -A 2 "Process: in.fcarena.app.debug" /tmp/fcarena-logcat.txt | grep -c "FATAL EXCEPTION" || true)" -eq 0
            grep -q "in.fcarena.app.debug/in.fcarena.app.SafeLauncherActivity" /tmp/fcarena-logcat.txt
            echo "FC Arena launcher completed without a process-level fatal exception"

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcarena-runtime-logcat-build4
          path: /tmp/fcarena-logcat.txt
          if-no-files-found: warn
          retention-days: 3
