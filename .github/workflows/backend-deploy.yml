name: FC ARENA deployment source inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure existing deployment connection
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -t ed25519 162.35.111.245 > /tmp/fcarena_host_key
          actual="$(ssh-keygen -lf /tmp/fcarena_host_key -E sha256 | awk '{print $2}')"
          test "$actual" = 'SHA256:4WyL0P7CfMAEcG3OQY6Jp4Q0q5lOtGPmad0bzHiJMvY'
          cat /tmp/fcarena_host_key >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect source and service paths without changing production
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15 fcarena-deploy@162.35.111.245 'python3 -' <<'PY'
          import pathlib,re,subprocess
          candidates=set()
          files=[pathlib.Path('/usr/local/sbin/fcarena-deploy')]
          files+=list(pathlib.Path('/etc/systemd/system').glob('*fcarena*.service'))
          for p in files:
              print('FILE',p)
              try: text=p.read_text()
              except Exception as e: print(type(e).__name__); continue
              for line in text.splitlines():
                  match=re.match(r'\s*(?:export\s+)?([A-Z_]*(?:DIR|ROOT|PATH))=[\"\']?(/[^\"\'\s]*)',line)
                  if match:
                      print(match.group(1),match.group(2)); candidates.add(pathlib.Path(match.group(2)))
                  if line.startswith('WorkingDirectory='):
                      directory=pathlib.Path(line.partition('=')[2]); candidates.add(directory); print(line)
                  if re.match(r'^User=[a-zA-Z0-9_-]+$',line): print(line)
                  if re.search(r'\b(npm|npx|pm2|systemctl)\b',line) and not re.search(r'://|password|secret|token|private|key',line,re.I): print(line[:300])
          for directory in list(candidates): candidates.update(directory.parents)
          for directory in sorted(candidates,key=str):
              if (directory/'.git').exists():
                  print('REPOSITORY',directory)
                  for args in [['rev-parse','HEAD'],['branch','--show-current'],['status','--short']]:
                      result=subprocess.run(['git','-c',f'safe.directory={directory}','-C',str(directory),*args],capture_output=True,text=True)
                      print(result.stdout.strip() or result.stderr.strip())
          for directory in ['/opt','/var/www','/srv']:
              try: print('DIRECTORIES',directory,[p.name for p in pathlib.Path(directory).iterdir() if p.is_dir()])
              except Exception: pass
          PY
