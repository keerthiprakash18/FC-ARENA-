name: Backend CI - VCCLHosting Manual Release

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fcarena-production-backend
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fcarena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fcarena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fcarena_test?schema=public
      JWT_ACCESS_SECRET: deploy-ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: deploy-ci-refresh-secret-at-least-32-characters
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      NODE_ENV: test
      AI_ASSISTANT_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        working-directory: apps/api
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Apply clean test migrations
        working-directory: apps/api
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: API build
        run: npm run build:api

      - name: API lint
        run: npm run lint --workspace=apps/api

      - name: API unit tests
        run: npm run test --workspace=apps/api

      - name: API E2E tests
        run: npm run test:e2e --workspace=apps/api

      - name: Critical dependency gate
        run: npm audit --audit-level=critical

