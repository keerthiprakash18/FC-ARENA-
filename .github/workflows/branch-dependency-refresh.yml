name: Branch Dependency Refresh

on:
  push:
    branches:
      - chore/final-10of10-cleanup
    paths:
      - ".github/workflows/branch-dependency-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Refresh web runtime and lint toolchain
        env:
          npm_config_strict_allow_scripts: "false"
        run: |
          npm install --workspace=apps/web --save-exact \
            next@16.4.0 react@19.3.0 react-dom@19.3.0
          npm install --workspace=apps/web --save-dev --save-exact \
            eslint@10.12.0 @types/react@19.3.0 @types/react-dom@19.3.0 @types/node@24

      - name: Refresh NestJS framework packages
        env:
          npm_config_strict_allow_scripts: "false"
        run: |
          npm install --workspace=apps/api --save-exact \
            @nestjs/common@12.1.2 @nestjs/core@12.1.2 @nestjs/platform-express@12.1.2
          npm install --workspace=apps/api --save-dev --save-exact \
            @nestjs/testing@12.1.2 @nestjs/cli@12.0.8 @nestjs/schematics@12.0.6

      - name: Reconcile install-script trust policy
        run: |
          npm install-scripts prune
          npm install-scripts approve @firebase/util @prisma/engines prisma
          npm install-scripts deny msgpackr-extract protobufjs tesseract.js
          npm install-scripts ls

      - name: Validate clean install under strict script policy
        run: |
          rm -rf node_modules
          npm ci

      - name: Security and regression gates
        env:
          NEXT_PUBLIC_API_URL: https://api.fcarena.in/api
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fcarena?schema=public
          JWT_ACCESS_SECRET: branch-refresh-access-secret-at-least-32-characters
          JWT_REFRESH_SECRET: branch-refresh-refresh-secret-at-least-32-characters
        run: |
          npm audit --audit-level=high
          npm run lint --workspace=apps/web
          npm run build:web
          npm run build:api
          npm run test --workspace=apps/api
          git diff --check

      - name: Commit refreshed manifests and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/web/package.json apps/api/package.json .npmrc
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore(deps): refresh supported framework toolchain"
          git push origin "HEAD:${GITHUB_REF_NAME}"
