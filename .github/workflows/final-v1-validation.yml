name: FC ARENA Final V1 Validation

on:
  push:
    branches:
      - fix/same-site-auth-session

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fcarena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fcarena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_PUBLIC_API_URL: https://fc-arena-production.up.railway.app/api
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fcarena?schema=public
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: final-v1-ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: final-v1-ci-refresh-secret-at-least-32-characters
      NODE_ENV: test
      AI_ASSISTANT_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma schema validation
        working-directory: apps/api
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Apply test database migrations
        working-directory: apps/api
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: API build
        run: npm run build:api

      - name: Full API unit tests
        run: npm run test --workspace=apps/api

      - name: Full API E2E tests
        run: npm run test:e2e --workspace=apps/api

      - name: New feature web lint
        working-directory: apps/web
        run: npx eslint src/app/ai/page.tsx src/app/more/page.tsx 'src/app/tournaments/[tournamentId]/poster/page.tsx' 'src/app/leagues/[leagueId]/roles/page.tsx' src/lib/api.ts next.config.ts

      - name: Web production build
        env:
          API_PROXY_TARGET: http://127.0.0.1:4100/api
        run: npm run build:web

      - name: Same-site auth proxy cookie smoke
        shell: bash
        env:
          API_PROXY_TARGET: http://127.0.0.1:4100/api
        run: |
          set -euo pipefail

          node - <<'NODE' > /tmp/mock-api.log 2>&1 &
          const http = require('http');

          const server = http.createServer((req, res) => {
            if (req.url === '/api/auth/logout' && req.method === 'POST') {
              res.statusCode = 200;
              res.setHeader(
                'Set-Cookie',
                'fc_arena_refresh_token=; Path=/api/auth; HttpOnly; Secure; SameSite=None',
              );
              res.setHeader('Content-Type', 'application/json');
              res.end(JSON.stringify({
                success: true,
                data: { message: 'Logged out successfully.' },
                error: null,
              }));
              return;
            }

            res.statusCode = 404;
            res.end('not found');
          });

          server.listen(4100, '127.0.0.1');
          NODE
          MOCK_PID=$!

          npm run start --workspace=apps/web -- --port 3000 > /tmp/next.log 2>&1 &
          NEXT_PID=$!

          cleanup() {
            kill "$NEXT_PID" "$MOCK_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              break
            fi
            sleep 1
          done

          headers="$(curl -si -X POST http://127.0.0.1:3000/api/auth/logout)"

          echo "$headers"
          echo "$headers" | grep -qi '^set-cookie: fc_arena_refresh_token='
          echo "$headers" | grep -q '"success":true'

      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
