name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "tests/deployment-id.test.cjs"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: https://api.fcarena.in/api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web lint
        run: npm run lint --workspace=apps/web

      - name: Validate Vercel deployment ID length
        run: node --test tests/deployment-id.test.cjs

      - name: Protect dashboard hero and mobile navigation contract
        run: node --test tests/dashboard-mobile-regression.test.cjs

      - name: Validate read-only VCCLHosting audit bash syntax
        run: bash -n ops/vnext-readonly-production-audit.sh

      - name: Compile and exercise offline release safety tools
        run: |
          python3 -m py_compile ops/vnext-production-source-inventory.py ops/build-staging-source-manifest.py ops/compare-vps-source-inventory.py
          python3 -m unittest discover -s ops/tests -p 'test_*.py'
          bash -n ops/verify-production-dump-offline.sh

      - name: Check restricted VPS inventory script syntax
        run: python3 -m py_compile ops/vnext-production-source-inventory.py

      - name: FC ARENA vNext UX, tournament and release safety regressions
        run: node --test tests/dashboard-next-actions.test.mjs tests/tournament-review-theme.test.mjs tests/tournament-create-preview.test.mjs tests/verify-live-baseline.test.mjs tests/weekly-verified-progress.test.mjs tests/dashboard-refresh-throttle.test.mjs tests/leaderboard-a11y.test.mjs tests/experience-trust-controls.test.mjs tests/owner-analytics-and-invites.test.mjs tests/rank-history-ui.test.mjs tests/vnext-production-audit.test.mjs tests/match-time-coordination.test.mjs tests/vnext-unified-design.test.mjs tests/isolated-db-restore.test.mjs tests/vnext-source-inventory.test.mjs tests/vnext-visual-language.test.mjs tests/league-war-responsive-filter.test.mjs tests/vnext-mobile-and-refresh.test.mjs tests/production-restore-safety.test.mjs tests/release-rehearsal-contract.test.mjs

      - name: Web production build
        run: npm run build:web

      - name: Install mobile UI smoke browser
        run: |
          npm ci --prefix apps/android/tests
          cd apps/android/tests
          npx playwright install --with-deps chromium

      - name: Mobile UI regression at 360/390/412/430 widths
        shell: bash
        run: |
          set -euo pipefail
          npm run start --workspace=apps/web > /tmp/fcarena-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              cat /tmp/fcarena-web.log
              exit 1
            fi
            sleep 1
          done
          SMOKE_OUTPUT=/tmp/fcarena-mobile-ui node apps/android/tests/ui-smoke.mjs
          SMOKE_WEB_ORIGIN=http://127.0.0.1:3000 node apps/android/tests/tournament-group-editor-regression.mjs

      - name: Upload complete UI verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcarena-ux-review-${{ github.sha }}
          path: |
            /tmp/fcarena-mobile-ui/*.png
            /tmp/fcarena-mobile-ui/results.json
          if-no-files-found: warn
          retention-days: 7
