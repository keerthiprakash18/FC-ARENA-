name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "tests/deployment-id.test.cjs"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: https://api.fcarena.in/api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web lint
        run: npm run lint --workspace=apps/web

      - name: Validate Vercel deployment ID length
        run: node --test tests/deployment-id.test.cjs

      - name: Protect dashboard hero and mobile navigation contract
        run: node --test tests/dashboard-mobile-regression.test.cjs

      - name: Web production build
        run: npm run build:web

      - name: Install mobile UI smoke browser
        run: |
          npm ci --prefix apps/android/tests
          cd apps/android/tests
          npx playwright install --with-deps chromium

      - name: Mobile UI regression at 360/390/412/430 widths
        shell: bash
        run: |
          set -euo pipefail
          npm run start --workspace=apps/web > /tmp/fcarena-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              cat /tmp/fcarena-web.log
              exit 1
            fi
            sleep 1
          done
          SMOKE_OUTPUT=/tmp/fcarena-mobile-ui node apps/android/tests/ui-smoke.mjs
