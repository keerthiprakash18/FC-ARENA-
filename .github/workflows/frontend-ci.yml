name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "tests/deployment-id.test.cjs"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: https://api.fcarena.in/api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web lint
        run: npm run lint --workspace=apps/web

      - name: Validate Vercel deployment ID length
        run: node --test tests/deployment-id.test.cjs

      - name: Web production build
        run: npm run build:web
