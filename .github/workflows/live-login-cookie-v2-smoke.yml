name: Live login cookie v2 smoke

on:
  push:
    branches:
      - smoke/live-login-cookie-v2

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for live SameSite Lax auth cookie
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 36); do
            response="$(curl --retry 3 --retry-delay 2 --retry-all-errors -si -X POST https://fcarena.in/api/auth/logout || true)"

            echo "Attempt $attempt"
            echo "$response" | sed -n '1,20p'

            if echo "$response" | grep -qi '^set-cookie: fc_arena_refresh_token=' \
              && echo "$response" | grep -qi 'samesite=lax' \
              && echo "$response" | grep -q '"success":true'; then
              echo "Live FC ARENA auth cookie is SameSite=Lax."
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for SameSite=Lax on live auth cookie."
          exit 1
