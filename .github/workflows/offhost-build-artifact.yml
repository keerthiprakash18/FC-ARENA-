# Builds immutable deployable files on GitHub Actions, NOT on VCL Hosting.
# Build on relevant main updates or manually; this workflow NEVER changes production.
name: FC ARENA - Off-host production build artifact

on:
  # Build deployable artifacts off-host whenever relevant code reaches main.
  # This never deploys or changes VCL production.
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/offhost-build-artifact.yml"
  pull_request:
    paths:
      - ".github/workflows/offhost-build-artifact.yml"
      - "ops/VCL_RELEASE_STORAGE_POLICY.md"
      - "apps/web/src/components/experience/birthday-magic*"
      - "apps/web/birthday-video-src/**"
      - "scripts/prepare-birthday-media.mjs"
      - "docs/features/birthday-magic-v6.md"
  workflow_dispatch:
    inputs:
      birthday_magic_enabled:
        description: 'Build WEB with reviewed Birthday Magic enabled; does not deploy'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fcarena-offhost-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.fcarena.in/api
      API_PROXY_TARGET: https://api.fcarena.in/api
      # Dummy CI build value only. Never inject production database credentials.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fcarena_build_only?schema=public
      JWT_ACCESS_SECRET: ci-dummy-access-secret-for-build-at-least-32-characters
      JWT_REFRESH_SECRET: ci-dummy-refresh-secret-for-build-at-least-32-characters
      FC_ARENA_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # IMPORTANT: Next resolves VERCEL_GIT_COMMIT_SHA before GITHUB_SHA.
      # On pull_request, GITHUB_SHA is the synthetic merge SHA, not the
      # reviewed candidate head. Without pinning, /web-release is wrong
      # even though the archive is correctly named for the head SHA.
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_FC_ARENA_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_DEPLOYMENT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
      # Build-time Next.js flag: only the explicitly reviewed Birthday V6 PR
      # candidate is enabled. The main branch and unrelated builds stay OFF.
      NEXT_PUBLIC_BIRTHDAY_MAGIC_ENABLED: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/birthday-magic-v6-staged-20261120') || (github.event_name == 'workflow_dispatch' && inputs.birthday_magic_enabled)) && 'true' || 'false' }}
      NEXT_PUBLIC_BIRTHDAY_VOICE_READY: 'false'
      # PR runs exercise the flagged Birthday Magic candidate; main stays OFF.
      # A manual dispatch can opt into the feature only after owner review.
    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies on GitHub runner
        run: npm ci --include=dev

      # Deterministic source-level tests only. This runner has no production
      # credentials, no SSH access, and never contacts or mutates live DB/media.
      # A failure stops packaging, so a failed feature safety check cannot
      # produce a deployable runtime artifact.
      - name: Offline FC ARENA feature and recovery regression gate
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/award-discovery-playoff-explanation.test.mjs \
            tests/playoff-bracket.test.mjs \
            tests/tournament-format-diagram.test.mjs \
            tests/tournament-create-preview.test.mjs \
            tests/standings-context-regression.test.mjs \
            tests/v12-premium-experience.test.mjs \
            tests/v12-clubs-season-public-i18n.test.mjs \
            tests/security-env.test.mjs \
            tests/date-of-birth.test.mjs \
            tests/production-restore-safety.test.mjs \
            tests/release-rehearsal-contract.test.mjs

      - name: Build API and Web on GitHub runner
        run: |
          set -euo pipefail
          npm run build:api
          npm run build:web
          test -f apps/api/dist/main.js || test -f apps/api/dist/main
          test -f apps/web/.next/BUILD_ID
          # Refuse release artifacts with the Birthday V6 switch accidentally OFF
          # or with a different/partial version of the user-approved opening film.
          if [[ "${NEXT_PUBLIC_BIRTHDAY_MAGIC_ENABLED:-}" == 'true' ]]; then
            test "$NEXT_PUBLIC_BIRTHDAY_MAGIC_ENABLED" = 'true' || {
              echo 'BIRTHDAY_V6_FLAG=BLOCKED: candidate built with feature disabled'; exit 1;
            }
            test "$NEXT_PUBLIC_BIRTHDAY_VOICE_READY" = 'false'
            test -s apps/web/public/birthday-magic/stadium.mp4
            echo 'f274956e3ec572a56f848e5c1057dda2add3b5bc631fda5fc295443f3cf49e07  apps/web/public/birthday-magic/stadium.mp4' | sha256sum -c
            test -s apps/web/public/birthday-magic/ambient.mp3
            echo 'BIRTHDAY_V6_FLAG=ON_APPROVED_PR_ONLY MEDIA_SHA256=PASS VOICE_READY=NO'
          else
            if [[ "${GITHUB_HEAD_REF:-}" == "feat/birthday-magic-v6-staged-20261120" ]]; then
              echo 'BIRTHDAY_V6_FLAG=BLOCKED: Birthday PR must build with flag ON'; exit 1;
            fi
            echo 'BIRTHDAY_V6_FLAG=OFF_NON_BIRTHDAY_BUILD'
          fi
          test -s apps/web/public/birthday-magic/stadium.mp4
          node scripts/prepare-birthday-media.mjs
          echo 'Approved 10s birthday film SHA256 checked before packaging.'

      - name: Boot compiled Next app on isolated GitHub loopback and verify its release SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$FC_ARENA_RELEASE_SHA"
          # Real next start against compiled, frozen files; no production host,
          # credentials, DB, user records or mutable services.
          (
            cd apps/web
            NODE_ENV=production node ../../node_modules/next/dist/bin/next start -H 127.0.0.1 -p 39871
          ) > "$RUNNER_TEMP/birthday-v6-compiled-next.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true; wait "$web_pid" 2>/dev/null || true' EXIT
          got=''
          for i in $(seq 1 30); do
            got="$(curl -fsS --max-time 3 http://127.0.0.1:39871/web-release 2>/dev/null | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{try{console.log(JSON.parse(s).release)}catch{process.exitCode=1}})' 2>/dev/null || true)"
            [[ "$got" == "$expected" ]] && break
            sleep 1
          done
          if [[ "$got" != "$expected" ]]; then
            echo "BLOCKED: compiled /web-release identity mismatch; expected=$expected actual=$got"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 12 --output /dev/null http://127.0.0.1:39871/
          curl --fail --silent --show-error --max-time 12 --range 0-1023 --output /dev/null http://127.0.0.1:39871/birthday-magic/stadium.mp4
          curl --fail --silent --show-error --max-time 12 --output /dev/null http://127.0.0.1:39871/birthday-magic/ambient.mp3
          echo "EXACT_COMPILED_RELEASE_SHA=PASS sha=$expected"
          echo 'ISOLATED_BIRTHDAY_WEB_AND_MEDIA_SMOKE=PASS PRODUCTION_CONTACTED=NO'

      - name: Package production-only runtime and checksum
        shell: bash
        run: |
          set -euo pipefail
          # No live credentials, DB files, uploads, backups or .env files are included.
          # npm prune is run only on the disposable GitHub runner.
          npm prune --omit=dev
          # After packaging, migrations should be run as a separate verified step.
          test -d node_modules/@prisma/client
          rm -rf apps/web/.next/cache
          mkdir -p release-output
          bundle="release-output/fcarena-runtime-${FC_ARENA_RELEASE_SHA}.tar.gz"
          tar -czf "$bundle" \
            --exclude='node_modules/.cache' \
            package.json package-lock.json \
            node_modules packages \
            apps/api/package.json apps/api/dist apps/api/prisma \
            apps/web/package.json apps/web/next.config.ts apps/web/.next apps/web/public
          (cd release-output && sha256sum "$(basename "$bundle")" > SHA256SUMS)
          printf '%s\n' "$FC_ARENA_RELEASE_SHA" > release-output/RELEASE_SHA.txt
          test -s "$bundle"
          (cd release-output && sha256sum -c SHA256SUMS)
          echo 'Built immutable runtime bundle on GitHub runner; VCL server untouched.'

      - name: Validate bundle identity, checksum, and absence of user data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ops/tests -p 'test_offhost_bundle.py' -v
          python3 ops/verify-offhost-runtime-bundle.py \
            --output-dir release-output \
            --release "$FC_ARENA_RELEASE_SHA"

      # The VCL host reports Ubuntu 24.04 x86_64, Node 24.22.1 and glibc 2.39.
      # Rehearse the EXACT packaged output on a disposable matching runner.
      # This does not boot a server, read user data or contact the production host.
      - name: Verify packaged native runtime on VCL-matching Linux runner
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/offhost-vcl-native-runtime.test.mjs
          stage="$(mktemp -d "$RUNNER_TEMP/fcarena-native-XXXXXXXX")"
          trap 'rm -rf "$stage"' EXIT
          tar -xzf "release-output/fcarena-runtime-${FC_ARENA_RELEASE_SHA}.tar.gz" -C "$stage" --no-same-owner --no-same-permissions
          node ops/verify-offhost-vcl-native-runtime.mjs "$stage"

      - name: Upload short-lived build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcarena-vcl-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-output/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
