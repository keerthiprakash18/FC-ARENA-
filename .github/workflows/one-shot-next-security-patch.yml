name: One Shot Next Security Patch

on:
  push:
    branches:
      - "security-hardening-2026-09-27"
    paths:
      - ".github/workflows/one-shot-next-security-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install patched Next.js release
        run: |
          npm install next@16.3.6 eslint-config-next@16.3.6 --workspace=apps/web --save-exact

      - name: Commit generated package metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json package-lock.json

          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi

          git commit -m "security: patch Next.js to 16.3.6 [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
