name: Play Compliance Verify

on:
  push:
    branches:
      - feature/play-store-compliance-pass
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_API_URL: https://api.fcarena.in/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Google Play compliance gate
        run: npm run check:play-compliance

      - name: Web lint
        run: npm run lint --workspace=apps/web

      - name: Web production build
        run: npm run build:web

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Android version validation
        run: node apps/android/verify-version.mjs

      - name: Android lint and release bundle
        working-directory: apps/android
        run: gradle :app:lintRelease :app:bundleRelease --stacktrace
