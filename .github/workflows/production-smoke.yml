name: Production Smoke Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: fcarena-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check public web
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            https://fcarena.in/ \
            > /dev/null

      - name: Check public API health
        run: |
          set -euo pipefail
          HEALTH_JSON="$(curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            https://api.fcarena.in/api/health)"
          printf '%s\n' "$HEALTH_JSON"
          printf '%s' "$HEALTH_JSON" | grep -q '"success":true'

