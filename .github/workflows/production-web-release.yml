name: VCCLHosting Production Release Verification

on:
  workflow_dispatch:
    inputs:
      component:
        description: Production component to verify
        type: choice
        options:
          - web
          - api
        default: web
      release_sha:
        description: Full deployed Git commit SHA (defaults to the selected ref's commit)
        type: string

permissions:
  contents: read

concurrency:
  group: fcarena-production-release-${{ inputs.component }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify the deployed VCCLHosting release
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          EXPECTED_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full lowercase Git commit SHA." >&2
            exit 1
          fi

          case "$COMPONENT" in
            web)
              url="https://fcarena.in/web-release"
              filter='.release | strings'
              ;;
            api)
              url="https://api.fcarena.in/api/health"
              filter='select(.success == true and .data.status == "healthy"
                and .data.database == "connected" and .data.redis == "connected")
                | .data.runtime.release | strings'
              ;;
            *)
              echo "Unknown production component: $COMPONENT" >&2
              exit 1
              ;;
          esac

          for attempt in $(seq 1 30); do
            actual_sha=""
            if body="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$url")"; then
              actual_sha="$(jq -er "$filter" <<< "$body")" || actual_sha=""
            fi
            if [[ "$actual_sha" == "$EXPECTED_SHA" ]]; then
              echo "VCCLHosting $COMPONENT production release verified: $actual_sha"
              exit 0
            fi
            echo "Attempt $attempt/30: $COMPONENT release is ${actual_sha:-unavailable or unhealthy}; expected $EXPECTED_SHA"
            if (( attempt < 30 )); then
              sleep 10
            fi
          done

          echo "VCCLHosting $COMPONENT did not serve healthy release $EXPECTED_SHA at $url." >&2
          exit 1
