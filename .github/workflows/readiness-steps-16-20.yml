name: Readiness Steps 16-20 Final Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "apps/api/**"
      - "apps/web/**"
      - "docs/readiness/step-16-privacy-data-safety.md"
      - "docs/readiness/step-17-play-final-audit.md"
      - "docs/readiness/step-18-release-system.md"
      - "docs/readiness/step-19-rollback-dr.md"
      - "docs/readiness/step-20-final-production-gate.md"
      - "docs/play-store/**"
      - "PLAY_STORE_RELEASE.md"
      - "ops/rollback/**"
      - "scripts/check-data-safety.mjs"
      - "scripts/check-play-store-compliance.mjs"
      - "scripts/final-release-gate.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/readiness-steps-16-20.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fcarena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fcarena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fcarena?schema=public
      JWT_ACCESS_SECRET: final-gate-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: final-gate-refresh-secret-at-least-32-characters
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      AI_ASSISTANT_ENABLED: "false"
      PUSH_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install dependencies
        run: npm ci

      - name: Apply isolated migrations
        working-directory: apps/api
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Privacy and Data Safety gate
        run: npm run check:data-safety

      - name: Google Play compliance gate
        run: npm run check:play-compliance

      - name: Final source/version release gate
        run: npm run check:final-release

      - name: Dependency security gate
        run: |
          npm audit --audit-level=critical
          node scripts/security-audit-gate.mjs

      - name: API build lint unit and E2E
        run: |
          npm run build:api
          npm run lint --workspace=apps/api
          npm run test --workspace=apps/api
          npm run test:e2e --workspace=apps/api

      - name: Web lint and production build
        run: |
          npm run lint --workspace=apps/web
          npm run build:web

      - name: Load Firebase client configuration when configured
        shell: bash
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > apps/android/app/google-services.json
          fi

      - name: Android version lint and release compilation (no AAB)
        working-directory: apps/android
        run: |
          node verify-version.mjs
          gradle :app:lintRelease :app:assembleDebug :app:compileReleaseJavaWithJavac :app:processReleaseResources --stacktrace

      - name: Validate rollback preflight syntax
        run: bash -n ops/rollback/check-readiness.sh

      - name: Validate signing helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "apps/android/build-signed-release.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            exit 1
          }

      - name: Diff whitespace check
        run: git diff --check
