name: Regenerate hardening lockfile

on:
  push:
    branches:
      - hardening/strict-10-10
    paths:
      - "package.json"
      - "apps/web/package.json"
      - ".github/workflows/regen-lock-hardening.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: hardening/strict-10-10
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): regenerate lockfile after lint hardening"
          git push origin HEAD:hardening/strict-10-10
