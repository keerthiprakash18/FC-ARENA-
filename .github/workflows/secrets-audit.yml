name: Repository Secrets Audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        env:
          VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          set -euo pipefail
          if curl --fail --silent --show-error --location --retry 3 --retry-delay 3 --retry-all-errors --connect-timeout 15 --max-time 90 "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz &&
             curl --fail --silent --show-error --location --retry 3 --retry-delay 3 --retry-all-errors --connect-timeout 15 --max-time 90 "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt" -o checksums.txt; then
            awk -v name="gitleaks_${VERSION}_linux_x64.tar.gz" '$2 == name { print $1 "  gitleaks.tar.gz" }' checksums.txt > selected-checksum.txt
            test -s selected-checksum.txt
            sha256sum --check selected-checksum.txt
            tar -xzf gitleaks.tar.gz gitleaks
          else
            echo "GitHub release CDN unavailable; build the same pinned Gitleaks version from verified Go modules."
            GOBIN="$RUNNER_TEMP" go install "github.com/zricethezav/gitleaks/v8@v${VERSION}"
          fi
          test -x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan all fetched history without exposing values
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks-report.json"
          trap 'rm -f "$report"' EXIT
          if "$RUNNER_TEMP/gitleaks" git --redact --report-format json --report-path "$report" --log-opts="--all"; then
            echo "Full-history credential scan: PASS"
          else
            # Print only path/rule/line/commit metadata; never log Secret, Match
            # or raw JSON. Report remains on the transient CI runner only.
            python3 - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path

          file = Path(sys.argv[1])
          try:
              findings = json.loads(file.read_text(encoding='utf-8'))
              if not isinstance(findings, list):
                  raise ValueError('Unexpected Gitleaks report')
              print(f"BLOCKED: {len(findings)} potential credential exposure(s) in Git history.")
              for finding in findings[:10]:
                  fields = {
                      'file': finding.get('File'),
                      'line': finding.get('StartLine'),
                      'rule': finding.get('RuleID'),
                      'commit_prefix': str(finding.get('Commit', ''))[:12],
                  }
                  print(json.dumps(fields, ensure_ascii=True))
          except (OSError, ValueError, TypeError) as error:
              print(f"BLOCKED: failed to read sanitized scan metadata: {type(error).__name__}")
          PY
            exit 1
          fi
