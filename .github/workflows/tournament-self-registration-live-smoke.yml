name: FC ARENA Live Auth Smoke

on:
  push:
    branches:
      - smoke/tournament-self-registration-live

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Verify live auth infrastructure
        shell: bash
        run: |
          set -euo pipefail

          check_status() {
            local url="$1"
            local expected="$2"
            local actual

            actual="$(curl --retry 6 --retry-delay 5 --retry-all-errors -sS -L -o /tmp/fc-arena-smoke-body -w '%{http_code}' "$url")"

            echo "$url -> HTTP $actual (expected $expected)"

            if [ "$actual" != "$expected" ]; then
              echo "Unexpected response body:"
              head -c 1200 /tmp/fc-arena-smoke-body || true
              exit 1
            fi
          }

          check_status "https://fcarena.in/" "200"
          check_status "https://fcarena.in/login" "200"

          health_code="$(curl --retry 6 --retry-delay 5 --retry-all-errors -sS -o /tmp/fc-health.json -w '%{http_code}' "https://fc-arena-production.up.railway.app/api/health")"

          echo "API health -> HTTP $health_code"
          cat /tmp/fc-health.json
          echo

          if [ "$health_code" != "200" ]; then
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const health = JSON.parse(fs.readFileSync("/tmp/fc-health.json", "utf8"));
            const value = health?.data?.emailDelivery;
            console.log("emailDelivery:", value);
            if (value !== "configured") {
              console.error("OTP email delivery is not configured in production.");
              process.exit(1);
            }
          '

          check_status "https://fc-arena-production.up.railway.app/api/auth/login" "404"
