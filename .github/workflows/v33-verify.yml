name: V3.3 Verify Only

on:
  push:
    branches:
      - feature/v3-3-admin-ops
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fcarena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fcarena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fcarena?schema=public
      JWT_ACCESS_SECRET: v33-ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: v33-ci-refresh-secret-at-least-32-characters
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      NODE_ENV: test
      AI_ASSISTANT_ENABLED: "false"
      NEXT_PUBLIC_API_URL: https://api.fcarena.in/api
      BACKUP_REPORT_TOKEN: v33-ci-backup-report-token-at-least-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        working-directory: apps/api
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Apply clean test migrations
        working-directory: apps/api
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: API build
        run: npm run build:api

      - name: API lint
        run: npm run lint --workspace=apps/api

      - name: API unit tests
        run: npm run test --workspace=apps/api

      - name: API E2E tests
        run: npm run test:e2e --workspace=apps/api

      - name: Web lint
        run: npm run lint --workspace=apps/web

      - name: Web production build
        run: npm run build:web

      - name: Verify Android version source
        run: node apps/android/verify-version.mjs

      - name: Validate backup script syntax
        run: bash -n ops/backup/fcarena-backup.sh

      - name: Validate Windows signing helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "apps/android/build-signed-release.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            exit 1
          }

      - name: Android lint and release bundle
        working-directory: apps/android
        run: gradle :app:lintRelease :app:bundleRelease --stacktrace

      - name: Critical dependency gate
        run: npm audit --audit-level=critical
