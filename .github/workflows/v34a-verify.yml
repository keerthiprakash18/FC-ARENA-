name: V3.4A Fair Play Verify

on:
  push:
    branches:
      - feature/v3-4a-fair-play-safe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fcarena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fcarena_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fcarena_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: v34a-test-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: v34a-test-refresh-secret-at-least-32-characters
      NEXT_PUBLIC_API_URL: https://api.fcarena.in/api
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install dependencies
        run: npm ci

      - name: Google Play compliance gate
        run: npm run check:play-compliance

      - name: Validate Prisma schema
        run: npm run prisma:validate --workspace=apps/api

      - name: Apply clean test migrations
        run: npm run prisma:migrate:deploy --workspace=apps/api

      - name: API build
        run: npm run build --workspace=apps/api

      - name: API lint
        run: npm run lint --workspace=apps/api

      - name: API unit tests
        run: npm test --workspace=apps/api -- --runInBand

      - name: API E2E tests
        run: npm run test:e2e --workspace=apps/api

      - name: Web lint
        run: npm run lint --workspace=apps/web

      - name: Web production build
        run: npm run build:web

      - name: Verify Android version source
        run: node apps/android/verify-version.mjs

      - name: Android lint and release bundle
        working-directory: apps/android
        run: gradle :app:lintRelease :app:bundleRelease --stacktrace

      - name: Critical dependency gate
        run: npm audit --audit-level=critical
