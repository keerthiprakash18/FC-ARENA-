[extend]
useDefault = true

[[allowlists]]
description = "Public Firebase Android client API key, not a server service-account credential"
condition = "AND"
paths = ['''^apps/android/app/google-services\.json$''']
regexTarget = "line"
regexes = ['''"current_key"\s*:\s*"''']

[[allowlists]]
description = "Unmodified public Nest typescript-starter CircleCI badge template"
condition = "AND"
paths = ['''^apps/api/README\.md$''']
regexTarget = "line"
regexes = ['''\[circleci-image\]:\s*https://img\.shields\.io/circleci/build/github/nestjs/nest/master\?token=''']

[[allowlists]]
description = "Public FC ARENA API release build SHA, documented as a release identifier (not an API credential)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/FC-ARENA-DESIGN-AND-RELEASE\.md$''']
regexTarget = "secret"
regexes = ['''^35ee5fa09f043d89500ce49bd5a3f13a4442cdf9$''']
