plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def versionPropsFile = file("../version.properties")
if (!versionPropsFile.exists()) {
    throw new GradleException("Missing apps/android/version.properties")
}
def versionProps = new Properties()
versionPropsFile.withInputStream { versionProps.load(it) }

def fcVersionCode = Integer.parseInt(versionProps.getProperty("VERSION_CODE"))
def fcVersionName = versionProps.getProperty("VERSION_NAME")

if (!fcVersionName) {
    throw new GradleException("VERSION_NAME is missing from apps/android/version.properties")
}

def keyStoreFile = System.getenv("FC_ARENA_KEYSTORE_FILE")
def keyStorePassword = System.getenv("FC_ARENA_STORE_PASSWORD")
def keyAliasValue = System.getenv("FC_ARENA_KEY_ALIAS")
def keyPasswordValue = System.getenv("FC_ARENA_KEY_PASSWORD")
def hasReleaseSigning = keyStoreFile && keyStorePassword && keyAliasValue && keyPasswordValue
def generatedIconResDir = file("$buildDir/generated/fcarenaIconRes")

tasks.register("prepareFCArenaIcon", Copy) {
    from file("../../web/public/icons/icon-512-v3.png")
    into file("$generatedIconResDir/drawable-nodpi")
    rename { "fc_arena_launcher.png" }
}

// Client Firebase configuration is public; never put service-account credentials here.
def firebaseConfigFile = file("google-services.json")
def firebaseConfig = firebaseConfigFile.exists() ? new groovy.json.JsonSlurper().parse(firebaseConfigFile) : null
def firebaseClient = firebaseConfig?.client?.find { it.client_info.android_client_info.package_name == 'in.fcarena.app' }
def firebaseString = { value -> groovy.json.JsonOutput.toJson(value ?: '') }

android {
    namespace 'in.fcarena.app'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'in.fcarena.app'
        minSdk 24
        targetSdk 36
        versionCode fcVersionCode
        versionName fcVersionName
        buildConfigField 'String', 'FIREBASE_APP_ID', firebaseString(firebaseClient?.client_info?.mobilesdk_app_id)
        buildConfigField 'String', 'FIREBASE_API_KEY', firebaseString(firebaseClient?.api_key?.getAt(0)?.current_key)
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', firebaseString(firebaseConfig?.project_info?.project_id)
        buildConfigField 'String', 'FIREBASE_SENDER_ID', firebaseString(firebaseConfig?.project_info?.project_number)
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keyStoreFile)
                storePassword keyStorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            res.srcDir generatedIconResDir
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.named("preBuild").configure {
    dependsOn("prepareFCArenaIcon")
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
}
