# Include inside the HTTPS server block for fcarena.in / www.fcarena.in.
# Send same-origin auth directly to Nest so TRUST_PROXY_HOPS=1 identifies the
# client correctly. Sending it through Next first adds an extra proxy hop and
# groups unrelated users under the loopback IP's auth rate-limit bucket.
location ^~ /api/auth/ {
    gzip off;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}
