# Include in both FC Arena HTTPS server blocks. On Nginx 1.24, each HTTPS
# listen directive must use `ssl http2` (the standalone `http2 on` needs 1.25.1+).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 4;
gzip_min_length 1024;
gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml application/manifest+json text/x-component;
# Do not add text/event-stream: match-room heartbeats must flush immediately.
# Keep `gzip off` in the dedicated /api/auth/ location on both hosts.
# Keep an established mobile connection available during short app switches.
# This reduces fresh handshakes without caching authenticated API responses.
# https://nginx.org/en/docs/http/ngx_http_core_module.html#keepalive_timeout
keepalive_timeout 180s;
