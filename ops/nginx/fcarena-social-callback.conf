# Include inside the managed fcarena.in HTTPS server block when social login
# is activated. The upstream is supplied by the managed runtime configuration.
location = /auth/social/callback {
    access_log off;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    proxy_pass http://fcarena_web_runtime;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
