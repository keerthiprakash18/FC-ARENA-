[Service]
User=fcarena-api
Group=fcarena-api
ExecStart=
ExecStart=/usr/bin/node /opt/fcarena/apps/api/dist/main.js
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
CapabilityBoundingSet=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
ReadWritePaths=/opt/fcarena/apps/api/storage /opt/fcarena/apps/api/uploads
UMask=0077
