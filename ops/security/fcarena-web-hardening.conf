[Service]
User=fcarena-web
Group=fcarena-web
ExecStart=
ExecStart=/usr/bin/node /opt/fcarena/apps/web/node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
CapabilityBoundingSet=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
ReadWritePaths=/opt/fcarena/apps/web/.next/cache
UMask=0077
